name: Deploy site

# The site is built from two repositories: this one, and the app repo, which is where the user docs
# actually live (scripts/sync-docs.mjs reads them at build time). So the build checks out both and
# points REIKAI_APP_REPO at the second one.

on:
  push:
    branches: [main]
  # The docs live in the app repo, so a change there does not push here. That repo's deploy-docs.yml
  # sends this event once its push has landed, which is the ordering that matters: a deploy started
  # before the push checks out the old docs and publishes a stale site.
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push wins rather than queueing behind an older one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The branch of the app repo the docs are read from, and the ref that links into that repo point
  # at. A dispatch from that repo names the branch it came from, so the literal below is only the
  # fallback for a push here or a manual run, and it does not have to be edited when a release
  # branch changes.
  APP_REF: ${{ github.event.client_payload.ref || 'feat/0.4.0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v7
        with:
          path: website

      - name: Check out the app repo for its docs
        uses: actions/checkout@v7
        with:
          repository: unseensnick/Reikai
          ref: ${{ env.APP_REF }}
          path: app

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
        working-directory: website

      - run: npm run build
        working-directory: website
        env:
          REIKAI_APP_REPO: ${{ github.workspace }}/app
          REIKAI_DOCS_REF: ${{ env.APP_REF }}
          # Lifts the releases-API rate limit that the download and changelog pages both hit. The
          # build works without it until a busy runner IP reaches the cap, and then those two pages
          # come up empty rather than failing, so this is worth passing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/src/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
