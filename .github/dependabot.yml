version: 2
updates:
  # Upstream's Renovate bumps are declined (UPSTREAM-SYNC.md), so this is what keeps the site's own
  # dependencies, and the ones VitePress pulls in, from going stale.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns:
          - "*"
  # The workflow takes GitHub's own actions on major tags, which pick up fixes by themselves; this flags a
  # new major before GitHub retires the old one's runtime.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
